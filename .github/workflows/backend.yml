name: Verify backend release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'lib/native.mjs'
      - 'lib/backend-release.json'
      - 'scripts/backend*.mjs'
      - 'scripts/sync-backend-pins.mjs'
      - 'test/backend-release.test.mjs'
      - '.github/workflows/backend.yml'

# Cancel superseded runs on the same ref; never interrupt a main run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: make check
      - name: Verify pinned binaries match the published release
        run: node scripts/sync-backend-pins.mjs --verify
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - name: Rebuild linux-x64 from pinned sources and compare SHA-256
        env:
          MANIFEST: lib/backend-release.json
        run: |
          set -euo pipefail
          REPO="$(node -p 'JSON.parse(require("fs").readFileSync(process.env.MANIFEST, "utf8")).repository')"
          TAG="$(node -p 'JSON.parse(require("fs").readFileSync(process.env.MANIFEST, "utf8")).tag')"
          VERSION="$(node -p 'JSON.parse(require("fs").readFileSync(process.env.MANIFEST, "utf8")).version')"
          EXPECTED="$(node -p 'JSON.parse(require("fs").readFileSync(process.env.MANIFEST, "utf8")).binaries["linux-x64"].sha256')"
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          git clone --depth 1 --branch "$TAG" "https://github.com/${REPO}.git" "$workdir/source"
          cd "$workdir/source"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -buildvcs=false \
            -ldflags="-s -w -X gemini-web2api/internal/app.Version=${VERSION}" \
            -o /tmp/provenance-check .
          ACTUAL="$(sha256sum /tmp/provenance-check | awk '{print $1}')"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Rebuilt linux-x64 SHA-256 $ACTUAL does not match pinned $EXPECTED"
            exit 1
          fi
          echo "Provenance verified: linux-x64 $ACTUAL"

  backend:
    name: Smoke (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-15
          - macos-15-intel
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - windows-2025
          - windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download, verify and start the pinned backend with isolated data
        run: node scripts/backend-smoke.mjs --download
